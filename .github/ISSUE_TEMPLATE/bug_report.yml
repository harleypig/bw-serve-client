name: Bug report
description: Something in the library, the update pipeline or the docs does not work as described.
labels: ["bug", "type:change"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem goes to a private report, not here: see the
        *Report a security vulnerability* link on the previous page.

        Remove every secret before you paste anything: passwords, session
        keys, TOTP seeds, vault item contents and API keys.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what went wrong, and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The shortest code or commands that show the problem.
      render: python
  - type: dropdown
    id: where
    attributes:
      label: Where it is
      options:
        - The library (bw_serve_client)
        - The update pipeline (pipeline.py, upstream/, codegen/)
        - The docs or examples
        - Not sure
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: bw-serve-client version
      description: "`python -c 'import bw_serve_client; print(bw_serve_client.__version__)'`, or the commit you installed from."
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Bitwarden CLI version
      description: "`bw --version` on the machine running `bw serve`."
  - type: input
    id: python-version
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, Ubuntu 24.04
  - type: dropdown
    id: connection
    attributes:
      label: How the library reaches bw serve
      options:
        - TCP (a URL such as http://localhost:8087)
        - A Unix socket
        - My own transport
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Log output or traceback
      description: With the secrets removed.
      render: text
