name: Build and Deploy Documentation

on:
  push:
    branches: [ master, main ]
    # The reference is built from the package's docstrings, so a change to
    # the package, or to the dependencies the build installs, redeploys it.
    paths:
      - 'docs/**'
      - 'bw_serve_client/**'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'bw_serve_client/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      # A change to this workflow builds on its PR, without deploying on merge.
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --only main,docs

      - name: Build Sphinx documentation
        run: |
          cd docs/html
          poetry run sphinx-build -W -b html source _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/html/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
