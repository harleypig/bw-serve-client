name: Build and Deploy Documentation

on:
  push:
    branches: [ master, main ]
    # The reference is built from the package's docstrings, so a change to
    # the package, or to the dependencies the build installs, redeploys it.
    paths:
      - 'docs/**'
      - 'bw_serve_client/**'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'bw_serve_client/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      # A change to this workflow builds on its PR, without deploying on merge.
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --only main,docs

      - name: Build Sphinx documentation
        run: |
          cd docs/html
          poetry run sphinx-build -W -b html source _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
