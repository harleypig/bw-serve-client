name: Release

# A vX.Y.Z tag, made by `make release-patch` (or -minor, -major) and pushed,
# runs this. docs/developer/releasing.md has the whole procedure.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry and tox
        shell: bash
        run: |
          pipx install poetry==2.5.1
          python -m pip install 'tox>=4.21'

      - name: Run tests
        run: python -m tox -e py

  build:
    name: Check the tag and build
    runs-on: ubuntu-latest
    needs: test
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The whole history, so the tagged commit can be checked against
      # master.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        shell: bash
        run: pipx install poetry==2.5.1

      - name: Check the tag matches the package version
        shell: bash
        run: |
          version=$(poetry version --short)
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bw_serve_client/__init__.py)
          echo "tag $TAG, pyproject.toml $version, __version__ $module"
          test "$TAG" = "v$version"
          test "$module" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the tagged commit is on master
        shell: bash
        run: git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/master

      # Refuses a missing or empty section, or one still holding an
      # update-pipeline draft.
      - name: Take the release notes from the changelog
        run: |
          mkdir -p notes
          python release.py notes "$VERSION" > notes/notes.md

      - name: Build
        run: poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            notes/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --notes-file notes/notes.md
          --verify-tag

  # Off until the PyPI trusted publisher and the pypi environment exist and
  # the repository variable PYPI_PUBLISH is "true"; see
  # docs/developer/releasing.md. Runs after the GitHub Release because a
  # PyPI upload cannot be taken back.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: github-release
    if: vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/bw-serve-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - uses: pypa/gh-action-pypi-publish@release/v1
